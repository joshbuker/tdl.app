inherit_gem:
  rubocop-athix:
    - config/rails.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.0.1
  Exclude:
    - 'db/migrate/*.rb'
    - 'db/schema.rb'

###########
## RSpec ##
###########

# Known issue with RSpec rubocop, remove when fixed
RSpec/DescribeClass:
  Exclude:
    - 'spec/requests/**/*'
    - 'spec/system/**/*'
# Rubocop doesn't recognize run_tests! as an example
RSpec/EmptyExampleGroup:
  Exclude:
    - 'spec/api/**/*'
# The Authorization header does not follow snake_case
RSpec/VariableName:
  Exclude:
    - 'spec/api/**/*'
# FIXME: This complains about the way we nest the model specs.
RSpec/NestedGroups:
  Max: 4

###########
## Style ##
###########

# Look upon thy field of fucks, and see that it is barren.
Style/FrozenStringLiteralComment:
  Enabled: false
# Might re-enable this later, but for now it's just annoying.
Style/Documentation:
  Enabled: false

#############
## Metrics ##
#############

# TODO: Is there a good way to break up specs without it getting unwieldy?
Metrics/BlockLength:
  IgnoredMethods: ['describe', 'context', 'configure']
