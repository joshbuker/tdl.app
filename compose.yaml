# TDL App server and its database. Configure with a .env file next to this one;
# see docs/self-hosting.md.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdl
      POSTGRES_DB: tdl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=tdl --dbname=tdl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: tdl-app/server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tdl:${POSTGRES_PASSWORD}@db:5432/tdl}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      # Only reachable from this machine; put a reverse proxy with HTTPS in front.
      - 127.0.0.1:${TDL_PORT:-3000}:3000

volumes:
  db-data:
