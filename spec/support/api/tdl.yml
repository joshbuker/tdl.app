openapi: 3.0.1
info:
  title: TDL App API
  version: v0
  description: >
    Provides a REST API backend for arbitrary TDL App front-ends.
  contact:
    name: TDL App Support
    email: support@tdl.app

servers:
  - url: https://api.tdl.app/v0
    description: Production Server
  - url: https://sandbox.tdl.app/v0
    description: >
      Sandbox server (that resets daily? not implementing until it's useful)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Schema for error response body
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Username:
      type: object
      properties:
        username:
          type: string
      required:
        - username
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    SessionToken:
      type: object
      properties:
        session_token:
          type: string
      required:
        - session_token
  responses:
    BadRequest:
      description: You did a dumb dumb
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: Endpoint not implemented yet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# Apply security scheme to all endpoints
security:
  - bearerAuth: []

paths:
  /login:
    post:
      summary: >
        Takes login credentials, and returns a JWT session token if successful.
      tags:
        - Authentication
      security: [] # Don't require login when logging in...
      requestBody:
        description: Username and password
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
        '400':
          $ref: '#/components/responses/BadRequest'
  /logout:
    delete:
      summary: >
        Logs out your current session by revoking the JWT token server-side.
      tags:
        - Authentication
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verify/token:
    post:
      summary: >
        2FA verification using a hardware token.
      tags:
        - Authentication
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /verify/app:
    post:
      summary: >
        2FA verification using an authy app.
      tags:
        - Authentication
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /username:
    get:
      summary: >
        Retrieves the current user's username.
      tags:
        - Settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Username'
        '401':
          $ref: '#/components/responses/Unauthorized'
