name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly run on main, so dependency and platform drift shows up
    # (see docs/design-decisions/releases-and-ci.md).
    - cron: '0 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licences
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Outside nix-shell, Playwright runs its own Chromium (see docs/design-decisions/nix-dev-shell.md).
      - run: pnpm --filter @tdl/client exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm check:scenarios

  image:
    # Builds the server image and runs it with compose.yaml and Postgres
    # (see docs/self-hosting.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: apps/server/test/smoke.sh
